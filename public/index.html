<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Mail Fetcher</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 sm:p-6 font-sans">

  <div class="w-full max-w-2xl my-auto space-y-8">
    <div class="text-center space-y-4">
      <div class="inline-flex items-center gap-2 px-4 py-1.5 bg-indigo-500/10 border border-indigo-500/30 text-indigo-400 rounded-full text-xs font-semibold tracking-wide uppercase shadow-lg shadow-indigo-500/10">
        <i class="fa-solid fa-bolt"></i> Universal Mail Portal
      </div>
      <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight text-white drop-shadow-md">
        Latest Inbox Fetcher
      </h1>
      <p class="text-slate-400 text-sm max-w-md mx-auto">Select a configured Dreamcrest address to retrieve the most recently received message securely.</p>
    </div>

    <!-- Controls -->
    <div class="bg-slate-900/60 backdrop-blur-md border border-slate-700/50 rounded-2xl p-6 shadow-2xl space-y-5">
      <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest">Target Inbox</label>
      <div class="flex flex-col sm:flex-row gap-4">
        <select id="emailSelect" class="flex-1 bg-slate-950/80 border border-slate-700 text-slate-200 rounded-xl px-4 py-3.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all shadow-inner">
          <option value="as2006dream@dreamcrest.net">as2006dream@dreamcrest.net</option>
          <option value="ad2006adb@dreamcrest.net">ad2006adb@dreamcrest.net</option>
          <option value="ax22@dreamcrest.net">ax22@dreamcrest.net</option>
        </select>
        <button id="fetchBtn" onclick="fetchEmail()" class="w-full sm:w-auto shrink-0 flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 px-8 rounded-xl transition-all shadow-lg shadow-indigo-600/25 active:scale-95">
          <i id="btnIcon" class="fa-solid fa-cloud-arrow-down"></i>
          <span id="btnText">Fetch Now</span>
        </button>
      </div>
    </div>

    <!-- Error State -->
    <div id="errorBox" class="hidden bg-rose-950/30 border border-rose-500/30 text-rose-300 p-4 rounded-xl text-sm flex items-start gap-3 backdrop-blur-sm shadow-xl">
      <i class="fa-solid fa-triangle-exclamation text-rose-500 mt-0.5"></i>
      <span id="errorMessage">Unable to fetch mail.</span>
    </div>

    <!-- Results State -->
    <div id="resultBox" class="hidden bg-slate-900/80 backdrop-blur-lg border border-slate-700/50 rounded-2xl shadow-2xl overflow-hidden transition-all duration-500">
      <div class="border-b border-slate-700/50 p-6 space-y-4 bg-slate-800/30">
        <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-4">
          <h2 id="emailSubject" class="text-lg font-bold text-white leading-tight">---</h2>
          <div class="flex flex-col items-end gap-2 shrink-0">
            <span id="folderBadge" class="text-xs px-3 py-1 rounded-lg font-bold uppercase tracking-wider hidden"></span>
            <span id="emailTime" class="text-xs bg-indigo-500/20 text-indigo-300 px-3 py-1.5 rounded-lg font-medium whitespace-nowrap shadow-inner border border-indigo-500/20">--</span>
          </div>
        </div>
        <div class="space-y-2 text-sm">
          <div class="flex gap-3 items-baseline">
            <span class="text-slate-500 font-bold uppercase text-xs tracking-wider w-12 shrink-0">From</span>
            <span id="emailFrom" class="text-slate-200 break-all font-medium">---</span>
          </div>
          <div class="flex gap-3 items-baseline">
            <span class="text-slate-500 font-bold uppercase text-xs tracking-wider w-12 shrink-0">To</span>
            <span id="emailTo" class="text-slate-400 break-all">---</span>
          </div>
        </div>
      </div>

      <div class="p-6">
        <div id="emailBody" class="mt-2 bg-white text-slate-900 rounded-xl overflow-hidden shadow-inner ring-1 ring-black/5">
          <iframe id="emailFrame" class="w-full bg-white" style="min-height: 400px; border: 0;" sandbox="allow-same-origin allow-popups" title="Email content"></iframe>
        </div>
        <pre id="emailText" class="hidden mt-2 whitespace-pre-wrap break-words bg-slate-950 border border-slate-800 text-slate-300 rounded-xl p-5 text-sm leading-relaxed font-mono max-h-96 overflow-auto shadow-inner"></pre>
      </div>
    </div>
  </div>

  <script>
    async function fetchEmail() {
      const email = document.getElementById('emailSelect').value;
      const fetchBtn = document.getElementById('fetchBtn');
      const btnIcon = document.getElementById('btnIcon');
      const btnText = document.getElementById('btnText');

      fetchBtn.disabled = true;
      btnIcon.classList.remove('fa-cloud-arrow-down');
      btnIcon.classList.add('fa-circle-notch', 'fa-spin');
      btnText.innerText = "Scanning Inbox & Spam...";

      document.getElementById('errorBox').classList.add('hidden');

      try {
        const res = await fetch('/api/fetch-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email })
        });
        const result = await res.json();

        if (!res.ok || !result.success) throw new Error(result.message || 'Error fetching email');

        const data = result.data;
        document.getElementById('emailSubject').innerText = data.subject || "No Subject";
        document.getElementById('emailFrom').innerText = data.from || "Unknown";
        document.getElementById('emailTo').innerText = data.to || email;
        document.getElementById('emailTime').innerText = new Date(data.date).toLocaleString([], {
          month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });

        const badge = document.getElementById('folderBadge');
        badge.classList.remove('hidden', 'bg-emerald-500/20', 'text-emerald-400', 'border-emerald-500/20', 'bg-rose-500/20', 'text-rose-400', 'border-rose-500/20');
        if (data.folder === 'SPAM') {
          badge.innerText = 'Found in Spam';
          badge.classList.add('bg-rose-500/20', 'text-rose-400', 'border', 'border-rose-500/20');
        } else {
          badge.innerText = 'Found in Inbox';
          badge.classList.add('bg-emerald-500/20', 'text-emerald-400', 'border', 'border-emerald-500/20');
        }

        const frame = document.getElementById('emailFrame');
        const textEl = document.getElementById('emailText');

        if (data.html) {
          frame.classList.remove('hidden');
          textEl.classList.add('hidden');
          frame.srcdoc = data.html;
        } else {
          frame.classList.add('hidden');
          textEl.classList.remove('hidden');
          textEl.innerText = data.text || "(This email has no readable content.)";
        }

        document.getElementById('resultBox').classList.remove('hidden');
      } catch(err) {
        document.getElementById('errorMessage').innerText = err.message;
        document.getElementById('errorBox').classList.remove('hidden');
      } finally {
        fetchBtn.disabled = false;
        btnIcon.classList.remove('fa-circle-notch', 'fa-spin');
        btnIcon.classList.add('fa-cloud-arrow-down');
        btnText.innerText = "Fetch Now";
      }
    }

    document.getElementById('emailFrame').addEventListener('load', function () {
      try {
        const doc = this.contentDocument || this.contentWindow.document;
        if (doc && doc.body) {
          this.style.height = (doc.body.scrollHeight + 32) + 'px';
        }
      } catch (e) {}
    });
  </script>
</body>
</html>
